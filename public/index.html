<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Vibe Together</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0a; color: #e5e5e5; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { width: min(40rem, 100%); box-sizing: border-box; padding: 2rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; }
  p { color: #a3a3a3; margin: 0 0 1.5rem; }
  button { padding: .6rem 1rem; border: 1px solid #262626; border-radius: .5rem; background: #171717; color: inherit; font: inherit; cursor: pointer; }
  button:hover { border-color: #525252; }
  #prompt { display: block; width: 100%; text-align: left; padding: 1rem; font: .95rem/1.5 ui-monospace, monospace; overflow-wrap: anywhere; }
  small { display: block; margin-top: .5rem; color: #737373; }
  a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Vibe Together</h1>
  <p>Code together, each with your own agent. Start a session, and each of you pastes its prompt into your own agent, and tells it your name.</p>
  <button id="new">New session</button>
  <button id="prompt" hidden></button>
  <small id="hint">Everything runs in your agents' harnesses: <a href="agents.md">agents.md</a>.</small>
</main>
<script>
  const RELAY = "https://polylogue.agentics.lwirth.com";
  const PAGE = "https://vibe-together.agentics.lwirth.com";
  const start = document.getElementById("new");
  const prompt = document.getElementById("prompt");
  const hint = document.getElementById("hint").firstChild;

  start.addEventListener("click", async () => {
    start.disabled = true;
    try {
      const response = await fetch(`${RELAY}/v1/s`, { method: "POST" });
      if (!response.ok) throw new Error(await response.text());
      const token = (await response.text()).trim().split("/").pop();
      prompt.textContent = `Read ${PAGE}/agents.md and join the session ${token}`;
      start.hidden = true;
      prompt.hidden = false;
      hint.textContent = "Click to copy, and send it to the others. Everything runs in your agents' harnesses: ";
    } catch (error) {
      start.disabled = false;
      hint.textContent = `The session could not be created: ${error.message}. `;
    }
  });

  prompt.addEventListener("click", async () => {
    await navigator.clipboard.writeText(prompt.textContent);
    hint.textContent = "Copied. Everything runs in your agents' harnesses: ";
  });
</script>
</body>
</html>
